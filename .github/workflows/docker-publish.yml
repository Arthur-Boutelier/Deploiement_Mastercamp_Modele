# =====================================================================
# Construction de l'image Docker et publication sur Docker Hub
# =====================================================================
# Ce workflow s'execute a chaque poussee sur la branche principale.
# Il construit l'image a partir du Dockerfile, puis la publie sur Docker Hub.
#
# Prerequis : definir deux secrets dans le depot GitHub
#   - DOCKERHUB_USERNAME : ton identifiant Docker Hub
#   - DOCKERHUB_TOKEN    : un jeton d'acces Docker Hub (pas le mot de passe)

name: Publier l'image sur Docker Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permet aussi un declenchement manuel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Authentification a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construction et publication de l'image
        uses: docker/build-push-action@v6
        with:
          # Dossier contenant le Dockerfile, le dossier app et requirements-gpu.txt.
          # Mets "." si ces fichiers sont a la racine du depot.
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/xray-api:latest
